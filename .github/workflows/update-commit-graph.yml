name: Update Commit Graph

on:
  schedule:
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate commit graph
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_GRAPH_USER: BJKJKZHOU
          GRAPH_TIMEZONE: Asia/Shanghai
          GRAPH_DAYS: "31"
          GRAPH_EXCLUDED_REPOS: BJKJKZHOU/BJKJKZHOU
        run: python3 scripts/update_commit_graph.py

      - name: Commit graph update
        run: |
          if git diff --quiet -- assets/commit-graph.svg; then
            echo "Commit graph unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/commit-graph.svg
          git commit -m "chore(profile): update commit graph"
          git push
